openapi: 3.1.0
info:
  title: Parma Growth Operator
  version: 1.1.0
servers:
  - url: https://supportive-stillness-production-ec37.up.railway.app
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: OK
  /tools/status:
    get:
      operationId: getStatus
      summary: Get Parma Growth Operator status
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
  /tools/google/test:
    get:
      operationId: testGoogleAds
      summary: Test the real Google Ads API connection
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
  /tools/google/campaign/{id}/metrics:
    get:
      operationId: getGoogleCampaignMetrics
      summary: Get Google Ads campaign metrics
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: OK
  /tools/campaign/{id}/metrics:
    get:
      operationId: getCampaignMetrics
      summary: Backward-compatible Google Ads campaign metrics endpoint
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: OK
  /tools/meta/campaign/{id}/metrics:
    get:
      operationId: getMetaCampaignMetrics
      summary: Get Meta Ads campaign metrics
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
