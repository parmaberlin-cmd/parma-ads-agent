openapi: 3.1.0
info:
  title: Parma Growth Operator
  version: 1.1.0
servers:
  - url: https://supportive-stillness-production-ec37.up.railway.app
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: OK
  /tools/status:
    get:
      operationId: getStatus
      summary: Get Parma Growth Operator status
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
  /tools/report/overview:
    get:
      operationId: getOverviewReport
      summary: Get the consolidated read-only advertising report
      security:
        - ApiKeyAuth: []
      parameters:
        - name: date_preset
          in: query
          required: false
          schema:
            type: string
            enum: [last_7d, last_14d, last_30d, last_90d]
            default: last_30d
      responses:
        "200":
          description: Consolidated Meta metrics and Google reader readiness
        "400":
          description: Invalid date preset
  /tools/agent/shadow/live:
    get:
      operationId: getLiveShadowAgentReport
      summary: Get the first operational read-only Agent shadow report from live Google Ads, GA4 and Meta data
      description: Returns the latest startup-generated shadow report. This endpoint never activates campaigns, publishes ads, enables delivery, or changes budgets.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Live shadow report completed
        "202":
          description: Live shadow report is still running
        "401":
          description: Unauthorized
        "500":
          description: Live shadow report failed safely
  /tools/google/test:
    get:
      operationId: testGoogleAds
      summary: Test the real Google Ads API connection
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
  /tools/google/campaign/{id}/metrics:
    get:
      operationId: getGoogleCampaignMetrics
      summary: Get Google Ads campaign metrics
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: OK
  /tools/campaign/{id}/metrics:
    get:
      operationId: getCampaignMetrics
      summary: Backward-compatible Google Ads campaign metrics endpoint
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: OK
  /tools/meta/campaign/{id}/metrics:
    get:
      operationId: getMetaCampaignMetrics
      summary: Get Meta Ads campaign metrics
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /tools/meta/proposal/dinner:
    get:
      operationId: getMetaDinnerProposal
      summary: Prepare a read-only Meta dinner campaign proposal for human review
      security:
        - ApiKeyAuth: []
      parameters:
        - name: daily_budget_eur
          in: query
          required: false
          schema:
            type: number
            minimum: 3
            maximum: 20
            default: 6
        - name: duration_days
          in: query
          required: false
          schema:
            type: integer
            minimum: 7
            maximum: 30
            default: 14
        - name: goal
          in: query
          required: false
          schema:
            type: string
            enum: [dinner_visits, reservations]
            default: dinner_visits
      responses:
        "200":
          description: Draft proposal based on current Meta state; no ads are created
        "400":
          description: Invalid proposal parameters
  /tools/meta/draft-assets:
    get:
      operationId: inspectMetaDinnerDraftAssets
      summary: Verify the connected Parma Instagram account and approved Reel in read-only mode
      security:
        - ApiKeyAuth: []
      parameters:
        - name: reel_permalink
          in: query
          required: true
          schema:
            type: string
            format: uri
            example: https://www.instagram.com/reel/C9M7_b6MayR/
      responses:
        "200":
          description: Non-secret Meta Page, Instagram account and Reel identifiers
        "400":
          description: Invalid Instagram Reel URL
        "500":
          description: The connected Page, Instagram account or Reel could not be verified
  /tools/meta/reservation-draft/preview:
    get:
      operationId: previewPausedMetaReservationDraft
      summary: Preview the fixed Parma reservations campaign as a paused-only Meta draft
      security:
        - ApiKeyAuth: []
      parameters:
        - name: starts_at
          in: query
          required: true
          description: Campaign start date-time including timezone; must be in the future
          schema:
            type: string
            format: date-time
            example: 2026-08-24T17:00:00+02:00
      responses:
        "200":
          description: Read-only preview; no Meta object is created
        "400":
          description: Invalid or past start date-time
        "500":
          description: Meta assets could not be prepared
  /tools/meta/reservation-draft/create:
    post:
      operationId: createPausedMetaReservationDraft
      summary: Create the approved Parma reservations campaign as PAUSED Meta objects only
      description: This operation never activates delivery or spend. It is blocked unless the server write gate is temporarily enabled and the exact human-approval phrase is supplied.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [starts_at, approval_token]
              properties:
                starts_at:
                  type: string
                  format: date-time
                  description: Campaign start date-time including timezone; must be in the future
                  example: 2026-08-24T17:00:00+02:00
                approval_token:
                  type: string
                  enum: [CREATE_PARMA_META_DRAFT_PAUSED_ONLY]
                  description: Exact scoped phrase confirming creation of paused draft objects only
      responses:
        "201":
          description: Campaign, ad set, creative and ad created and verified PAUSED
        "400":
          description: Invalid request
        "403":
          description: Server write gate disabled or approval phrase missing
        "409":
          description: A draft already exists for the selected start date
        "502":
          description: Partial paused draft; returned object IDs require inspection
components:
  schemas: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
