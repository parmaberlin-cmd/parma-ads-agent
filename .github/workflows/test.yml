name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Security check high or critical
        run: npm audit --audit-level=high
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Pre-access release validation
        run: PREACCESS_TESTS_PASSED=true PREACCESS_SYNTAX_PASSED=true npm run validate:preaccess
