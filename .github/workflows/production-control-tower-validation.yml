name: production-control-tower-validation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtain short-lived GitHub OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=parma-autonomous-objective-ingress")
          TOKEN=$(printf '%s' "$RESP" | jq -r '.value')
          test -n "$TOKEN" -a "$TOKEN" != null
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Validate production control tower and recurring scheduler
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://supportive-stillness-production-ec37.up.railway.app'
          AUTH_SCHEME="Bearer"
          AUTH_HEADER="Authorization: ${AUTH_SCHEME} ${OIDC_TOKEN}"

          get_json() {
            local url="$1" out="$2" code
            code=$(curl -sS -o "$out" -w '%{http_code}' "$url" -H "$AUTH_HEADER" || true)
            echo "$code"
          }

          control_code=$(get_json "$BASE/tools/agent/control-tower" control-tower-1.json)
          recurring_code=$(get_json "$BASE/tools/agent/recurring" recurring-1.json)
          health_code=$(curl -sS -o runner-1.json -w '%{http_code}' "$BASE/health/autonomous-runner" || true)
          dashboard_code=$(curl -sS -o dashboard.json -w '%{http_code}' "$BASE/health/agent-dashboard" || true)
          cycle_code=$(curl -sS -o cycle.json -w '%{http_code}' "$BASE/health/agent-cycle" || true)

          test "$control_code" = "200"
          test "$recurring_code" = "200"
          test "$health_code" = "200"
          test "$dashboard_code" = "200"
          test "$cycle_code" = "200"

          sleep 35

          get_json "$BASE/tools/agent/recurring" recurring-2.json >/dev/null
          curl -sS "$BASE/health/autonomous-runner" -o runner-2.json >/dev/null

          jq -e '.success==true and .schema=="parma.control_tower.v1" and .runner.status=="RUNNING"' control-tower-1.json >/dev/null
          jq -e '.success==true and .timezone=="Europe/Berlin" and (.schedules|type)=="array"' recurring-1.json >/dev/null

          jq -e '.writes_allowed==false and .execution_allowed==false and .spend_allowed==false' dashboard.json >/dev/null
          jq -e '.writes_allowed==false and .execution_allowed==false and .spend_allowed==false' cycle.json >/dev/null

          jq -e '.recurring_bootstrap.status=="healthy" and .recurring_bootstrap.reconciled==true' control-tower-1.json >/dev/null
          jq -e '.schedules|map(select(.id=="autonomous-business-loop-google-cycle"))|length==1' recurring-1.json >/dev/null
          jq -e '.schedules[]|select(.id=="autonomous-business-loop-google-cycle")|.enabled==true' recurring-1.json >/dev/null
          jq -e '.action_registry|map(select(.kind=="google_ads.cycle_plan" and .implemented==true and .write==false and .spend==false))|length>=1' control-tower-1.json >/dev/null

          jq -e '.runner.status=="RUNNING" and (.runner.heartbeat_age_ms|type=="number")' runner-1.json >/dev/null
          jq -e '.runner.status=="RUNNING" and (.runner.heartbeat_age_ms|type=="number")' runner-2.json >/dev/null
          jq -e '(.last_scan_at//"") != ""' recurring-1.json >/dev/null
          jq -e '(.last_scan_at//"") != ""' recurring-2.json >/dev/null
          jq -e '.storage.durable==true' runner-1.json >/dev/null
          jq -e '.storage.durable==true' recurring-1.json >/dev/null

          jq -n \
            --arg expected_sha "$EXPECTED_SHA" \
            --arg control_tower_http "$control_code" \
            --arg recurring_http "$recurring_code" \
            --arg health_http "$health_code" \
            --arg dashboard_http "$dashboard_code" \
            --arg cycle_http "$cycle_code" \
            --arg recurring_bootstrap_status "$(jq -r '.recurring_bootstrap.status' control-tower-1.json)" \
            --arg recurring_bootstrap_reason "$(jq -r '.recurring_bootstrap.reason // "none"' control-tower-1.json)" \
            --arg scheduler_state_error "$(jq -r '.recurring.state_error // "none"' control-tower-1.json)" \
            --arg scheduler_last_scan_at_1 "$(jq -r '.last_scan_at // "none"' recurring-1.json)" \
            --arg scheduler_last_scan_at_2 "$(jq -r '.last_scan_at // "none"' recurring-2.json)" \
            --arg managed_schedule_id "$(jq -r '.schedules[]|select(.id=="autonomous-business-loop-google-cycle")|.id' recurring-1.json)" \
            --argjson managed_schedule_enabled "$(jq '.schedules[]|select(.id=="autonomous-business-loop-google-cycle")|.enabled' recurring-1.json)" \
            --argjson managed_schedule_cadence "$(jq '.schedules[]|select(.id=="autonomous-business-loop-google-cycle")|.cadence' recurring-1.json)" \
            --arg managed_schedule_last_slot "$(jq -r '.schedules[]|select(.id=="autonomous-business-loop-google-cycle")|.last_slot // "none"' recurring-1.json)" \
            --argjson cycle_plan_registered "$(jq '.action_registry|map(select(.kind=="google_ads.cycle_plan" and .implemented==true and .write==false and .spend==false))|length>=1' control-tower-1.json)" \
            --arg runner_started_at "$(jq -r '.runner.started_at // "none"' runner-1.json)" \
            --arg runner_heartbeat_at "$(jq -r '.runner.heartbeat_at // "none"' runner-1.json)" \
            --argjson heartbeat_age_ms_1 "$(jq '.runner.heartbeat_age_ms' runner-1.json)" \
            --argjson heartbeat_age_ms_2 "$(jq '.runner.heartbeat_age_ms' runner-2.json)" \
            --argjson dashboard_guardrails "$(jq '{writes_allowed,execution_allowed,spend_allowed}' dashboard.json)" \
            --argjson cycle_guardrails "$(jq '{writes_allowed,execution_allowed,spend_allowed}' cycle.json)" \
            --argjson recurring_schedule_present "$(jq '.schedules|map(select(.id=="autonomous-business-loop-google-cycle"))|length==1' recurring-1.json)" \
            --argjson recurring_loop_no_manual_continue_required true \
            --argjson validation_no_mutations_or_spend true \
            '{
              expected_main_sha: $expected_sha,
              control_tower_http_status: $control_tower_http,
              recurring_http_status: $recurring_http,
              runner_health_http_status: $health_http,
              dashboard_http_status: $dashboard_http,
              cycle_http_status: $cycle_http,
              recurring_bootstrap: {status: $recurring_bootstrap_status, reason: $recurring_bootstrap_reason},
              recurring_scheduler: {state_error: $scheduler_state_error, last_scan_at_first: $scheduler_last_scan_at_1, last_scan_at_second: $scheduler_last_scan_at_2},
              managed_recurring_schedule: {
                id: $managed_schedule_id,
                exists: $recurring_schedule_present,
                enabled: $managed_schedule_enabled,
                cadence: $managed_schedule_cadence,
                last_slot: $managed_schedule_last_slot
              },
              cycle_plan_action_registered_readonly: $cycle_plan_registered,
              runtime_liveness: {
                started_at: $runner_started_at,
                heartbeat_at: $runner_heartbeat_at,
                heartbeat_age_ms_first: $heartbeat_age_ms_1,
                heartbeat_age_ms_second: $heartbeat_age_ms_2
              },
              guardrails: {
                dashboard: $dashboard_guardrails,
                cycle: $cycle_guardrails
              },
              no_manual_continue_prompt_required: $recurring_loop_no_manual_continue_required,
              no_mutation_or_spend_during_validation: $validation_no_mutations_or_spend
            }' > validation-report.json

          cat validation-report.json
