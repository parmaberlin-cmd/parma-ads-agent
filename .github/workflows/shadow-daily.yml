name: shadow-daily

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read
  statuses: write

jobs:
  shadow-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Railway deploy
        if: github.event_name == 'push'
        run: sleep 45
      - name: Read sanitized Shadow health and publish status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          URL="https://supportive-stillness-production-ec37.up.railway.app/health/agent-shadow-summary"
          code="000"
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o response.json -w "%{http_code}" "$URL" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 15
          done
          status=$(jq -r '.status // "unreadable"' response.json 2>/dev/null || echo unreadable)
          google=$(jq -r '.source_health.google // false' response.json 2>/dev/null || echo false)
          ga4=$(jq -r '.source_health.ga4 // false' response.json 2>/dev/null || echo false)
          meta=$(jq -r '.source_health.meta // false' response.json 2>/dev/null || echo false)
          writes=$(jq -r '.writes_allowed // true' response.json 2>/dev/null || echo true)
          if [ "$code" = "200" ] && [ "$status" = "completed" ] && [ "$writes" = "false" ]; then
            state="success"
          else
            state="failure"
          fi
          description="shadow=${status}; google=${google}; ga4=${ga4}; meta=${meta}; writes=${writes}"
          context="shadow-live-health:g=${google}:ga4=${ga4}:m=${meta}"
          payload=$(jq -n --arg state "$state" --arg description "$description" --arg context "$context" '{state:$state,context:$context,description:$description}')
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$payload"
          cat response.json
          if [ "$state" != "success" ]; then exit 1; fi
