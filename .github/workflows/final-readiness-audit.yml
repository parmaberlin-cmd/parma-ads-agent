name: final-readiness-audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Railway deploy
        if: github.event_name == 'push'
        run: sleep 60
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch sanitized runtime evidence
        run: |
          set -euo pipefail
          BASE="https://supportive-stillness-production-ec37.up.railway.app"
          for i in 1 2 3 4 5 6; do
            s=$(curl -sS -o shadow.json -w "%{http_code}" "$BASE/health/agent-shadow-summary" || true)
            m=$(curl -sS -o meta.json -w "%{http_code}" "$BASE/health/meta-real-preflight-summary" || true)
            if [ "$s" = "200" ] && [ "$m" = "200" ]; then break; fi
            sleep 15
          done
          test "${s:-000}" = "200"
          test "${m:-000}" = "200"
      - name: Run independent audit and publish compact status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          audit_rc=0
          node scripts/run-final-readiness-audit.js > audit.json || audit_rc=$?
          software=$(jq -r '.software_complete // false' audit.json)
          read_only=$(jq -r '.autonomous_read_only_ready // false' audit.json)
          external=$(jq -r '.blockers.external | length' audit.json)
          timed=$(jq -r '.blockers.time_based | length' audit.json)
          software_blockers=$(jq -r '.blockers.software | length' audit.json)
          if [ "$software" = "true" ]; then state="success"; else state="failure"; fi
          context="final-audit:software=${software}:readonly=${read_only}:ext=${external}:time=${timed}"
          description="software=${software}; readonly=${read_only}; external=${external}; time=${timed}; software_blockers=${software_blockers}"
          payload=$(jq -n --arg state "$state" --arg description "$description" --arg context "$context" '{state:$state,context:$context,description:$description}')
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$payload"
          cat audit.json
          if [ "$state" != "success" ]; then exit "${audit_rc:-1}"; fi
