name: runtime-readiness-v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Railway deploy
        if: github.event_name == 'push'
        run: sleep 60
      - name: Read sanitized runtime summaries and publish compact status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="https://supportive-stillness-production-ec37.up.railway.app"
          shadow_code="000"
          meta_code="000"
          for i in 1 2 3 4 5 6; do
            shadow_code=$(curl -sS -o shadow.json -w "%{http_code}" "$BASE/health/agent-shadow-summary" || true)
            meta_code=$(curl -sS -o meta.json -w "%{http_code}" "$BASE/health/meta-real-preflight-summary" || true)
            shadow_status=$(jq -r '.status // "unreadable"' shadow.json 2>/dev/null || echo unreadable)
            meta_status=$(jq -r '.status // "unreadable"' meta.json 2>/dev/null || echo unreadable)
            if [ "$shadow_code" = "200" ] && [ "$shadow_status" = "completed" ] && [ "$meta_code" = "200" ] && [ "$meta_status" = "completed" ]; then break; fi
            sleep 15
          done

          google=$(jq -r '.source_health.google // false' shadow.json 2>/dev/null || echo false)
          ga4=$(jq -r '.source_health.ga4 // false' shadow.json 2>/dev/null || echo false)
          meta=$(jq -r '.source_health.meta // false' shadow.json 2>/dev/null || echo false)
          writes=$(jq -r 'if has("writes_allowed") then .writes_allowed else true end' shadow.json 2>/dev/null || echo true)
          greason=$(jq -r '.source_diagnostics.google.reason // .source_diagnostics.google.category // "none"' shadow.json 2>/dev/null || echo none)
          rs_configured=$(jq -r 'if (.tracking.reservation_start | type) == "object" then (.tracking.reservation_start.configured // false) else (.tracking.reservation_start // false) end' shadow.json 2>/dev/null || echo false)
          rs_observed=$(jq -r 'if (.tracking.reservation_start | type) == "object" then (.tracking.reservation_start.observed // false) else (.tracking.reservation_start // false) end' shadow.json 2>/dev/null || echo false)
          read_ready=$(jq -r '.read_only_ready // .ready // false' meta.json 2>/dev/null || echo false)
          write_ready=$(jq -r '.write_ready // false' meta.json 2>/dev/null || echo false)
          meta_blocker=$(jq -r '.blockers[0] // "none"' meta.json 2>/dev/null || echo unreadable)
          schedule_safe=$(jq -r '.account.schedule_conversion_safe // false' meta.json 2>/dev/null || echo false)

          safe_greason=$(printf '%s' "$greason" | tr -cs 'A-Za-z0-9_-' '_' | cut -c1-24)
          safe_mb=$(printf '%s' "$meta_blocker" | tr -cs 'A-Za-z0-9_-' '_' | cut -c1-18)

          if [ "$shadow_code" = "200" ] && [ "$meta_code" = "200" ] && [ "$writes" = "false" ] && [ "$read_ready" = "true" ] && [ "$schedule_safe" = "true" ]; then state="success"; else state="failure"; fi
          context="runtime:g=${google}:${safe_greason}:ga4=${ga4}:rso=${rs_observed}:m=${meta}:mr=${read_ready}"
          description="g=${google}/${safe_greason}; ga4=${ga4}; rs_cfg=${rs_configured}; rs_obs=${rs_observed}; m=${meta}; mr=${read_ready}; mw=${write_ready}; mb=${safe_mb}"
          payload=$(jq -n --arg state "$state" --arg description "$description" --arg context "$context" '{state:$state,context:$context,description:$description}')
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPO/statuses/$SHA" -d "$payload"
          echo "$description"
          if [ "$state" != "success" ]; then exit 1; fi
